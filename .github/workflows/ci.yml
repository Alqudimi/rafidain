name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check rafidain tests finetune evaluation scripts

      - name: Tests (mock engine, no GPU)
        run: pytest -q

      - name: Types (mypy, advisory)
        run: mypy rafidain || true

  smoke-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -e ".[dev]"
      - name: Boot with the mock engine & run the end-to-end smoke client
        run: |
          RAFIDAIN__ENGINE__IMPL=mock RAFIDAIN__ENGINE__EAGER_LOAD=true \
            uvicorn rafidain.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 2; done
          python scripts/smoke_ws_client.py --url http://127.0.0.1:8000 --seconds 1
