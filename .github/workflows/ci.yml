name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Sync the locked environment (light + dev + webui)
        run: uv sync --python 3.11 --frozen --group dev --extra webui

      - name: Lint (ruff)
        run: uv run --python 3.11 python -m ruff check rafidain tests finetune evaluation scripts

      - name: Tests (mock engine, no GPU)
        run: uv run --python 3.11 python -m pytest -q

      - name: Types (mypy, advisory)
        run: uv run --python 3.11 python -m mypy rafidain || true

  smoke-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Sync the locked environment (light + dev + webui)
        run: uv sync --python 3.11 --frozen --group dev --extra webui
      - name: End-to-end smoke test (server + web UI + WS streaming)
        run: bash scripts/smoke_e2e.sh
